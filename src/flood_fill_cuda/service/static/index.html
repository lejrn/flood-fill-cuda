<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flood Fill — Paint</title>
<link rel="stylesheet" href="/paint.css">
</head>
<body>
<div id="stage">
  <canvas id="paint"></canvas>
</div>

<div id="toolbar" role="group" aria-label="Paint controls">
  <button class="brush-btn active" data-shape="circle" title="Circle" aria-label="Circle brush">●</button>
  <button class="brush-btn" data-shape="star" title="Star" aria-label="Star brush">★</button>
  <button class="brush-btn" data-shape="square" title="Square" aria-label="Square brush">■</button>
  <button class="brush-btn" data-shape="scratchy" title="Scratchy" aria-label="Scratchy brush">✎</button>
  <span class="toolbar-divider"></span>
  <button class="mode-btn" data-mode="cpu" title="Fill on the CPU" aria-label="CPU mode">CPU</button>
  <button class="mode-btn active" data-mode="gpu" title="Fill on the GPU" aria-label="GPU mode">GPU</button>
</div>

<div id="hint">Paint a thick blob, then let go — the GPU floods it, then it fades away.
  &nbsp;·&nbsp; <a href="/skywatch.html" style="color:inherit">▶ SKYWATCH</a> — the seedless-discovery air-defense game</div>

<script src="/paint.js" defer></script>
</body>
</html>
