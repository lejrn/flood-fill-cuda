<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flood Fill — Paint</title>
<link rel="stylesheet" href="/paint.css">
</head>
<body>
<div id="stage">
  <canvas id="paint"></canvas>
</div>

<div id="toolbar" role="group" aria-label="Paint controls">
  <button class="brush-btn active" data-shape="circle" title="Circle" aria-label="Circle brush">●</button>
  <button class="brush-btn" data-shape="star" title="Star" aria-label="Star brush">★</button>
  <button class="brush-btn" data-shape="square" title="Square" aria-label="Square brush">■</button>
  <button class="brush-btn" data-shape="scratchy" title="Scratchy" aria-label="Scratchy brush">✎</button>
  <span class="toolbar-divider"></span>
  <button class="mode-btn" data-mode="cpu" title="Seeded flood fill on the CPU (ch01)" aria-label="CPU mode">CPU</button>
  <button class="mode-btn active" data-mode="gpu" title="Seeded flood fill on the GPU (ch03)" aria-label="GPU mode">GPU</button>
  <button class="mode-btn" data-mode="runs" title="Seedless: ch06 finds and recolours every blob at once" aria-label="RUNS mode">RUNS</button>
</div>

<div id="hint">Paint a thick blob, then let go — the GPU floods it, then it fades away.
  &nbsp;·&nbsp; <b>RUNS</b> takes no seed: ch06 finds every blob itself.
  &nbsp;·&nbsp; <a href="/skysurvey.html" style="color:inherit">✦ DEEP FIELD</a> — guess the star count, the GPU counts for real</div>

<script src="/paint.js" defer></script>
</body>
</html>
