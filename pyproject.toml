[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flood-fill-cuda"
version = "0.21.0"
description = "GPU-accelerated flood fill algorithm implementation using CUDA and Numba"
authors = [
    {name = "TL"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numba>=0.65.1",
    "numpy>=1.24.0,<2.5",
    "cupy-cuda12x>=14.1.1",
    "cuda-python>=12.9.0,<13.0.0",
    "matplotlib>=3.10.0",
    "pillow>=12.0.0",
    "opencv-python>=4.11.0.86,<5.0.0.0",
    "rich>=13.9.4",
    "nvtx>=0.2.11",
    "ipykernel>=6.29.5",
    "ipython>=8.12.3",
    "triton>=3.7.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flood_fill_cuda"]

[tool.pytest.ini_options]
testpaths = ["src/flood_fill_cuda"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "jupyter>=1.0.0",
    "httpx>=0.27.0",
]

