[project]
name = "flood-fill-cuda"
version = "0.3.0"
description = "GPU-accelerated flood fill algorithm implementation using CUDA and Numba"
authors = [
    {name = "TL"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numba>=0.65.1",
    "numpy>=1.24.0,<2.5",
    "cupy-cuda12x>=14.1.1",
    "cuda-python>=12.9.0,<13.0.0",
    "matplotlib>=3.10.0",
    "pillow>=12.0.0",
    "opencv-python>=4.11.0.86,<5.0.0.0",
    "rich>=13.9.4",
    "nvtx>=0.2.11",
    "ipykernel>=6.29.5",
    "ipython>=8.12.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "jupyter>=1.0.0",
]

