# Publish project-page/ to GitHub Pages at <owner>.github.io/<repo>/.
# Settings > Pages > Source must be "GitHub Actions".
name: Project page

on:
  push:
    branches: [main]
    paths:
      - "project-page/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: project-page
      - id: deployment
        uses: actions/deploy-pages@v5
